<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OPENNOF1 - 全自动货币交易系统{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js v4.5.0 随仓库分发，避免外部 CDN 带来的供应链与可用性风险 -->
    <script src="{{ url_for('static', filename='js/vendor/chart.umd.min.js') }}"></script>
</head>

<body>
    <nav class="navbar">
        <span class="navbar-brand">OPENNOF1</span>
        <div class="navbar-controls">
            <div class="navbar-status">
                <span id="status-dot" class="status-dot stopped"></span>
                <span id="status-text">已停止</span>
            </div>
            <button class="btn btn-sm navbar-auth-btn" id="btn-console-login">控制台登录</button>
            <button class="btn btn-sm navbar-auth-btn" id="btn-console-logout" hidden>退出</button>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>

</html>
